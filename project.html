<!DOCTYPE html>
<html lang="en">

<head>

    <title>Infinity Connects</title>

<body>

                <li>About</li>
                <li>Contact</li>

            <h1>INFINITY CONNECTS</h1>

            <p>

        </div>

            <h3>Mango</h3>
        </div>


        <div class="fruit">
            <img
                src="https://images.unsplash.com/photo-1589820296156-2454bb8a6ad1?auto=format&fit=crop&w=600&q=80"

            <h3>Pineapple</h3>
        </div>

    </section>


    
    <div class="container">

        <h2>Components</h2>

        <div class="parts">

            <div>S1</div>
            <div>S2</div>
            <div>S3</div>

        </div>
